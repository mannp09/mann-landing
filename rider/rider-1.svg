<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- Candidate 1: flat sticker, thick 3px round outlines, round shapes -->
  <style>
    .ink{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .fillc{fill:var(--rider-fill,#E7DECC);stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .paperc{fill:var(--rider-paper,#FBF7EF);stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .accent{fill:var(--rider-accent,#D97757);stroke:currentColor;stroke-width:2;stroke-linejoin:round}
  </style>

  <g id="bull">
    <path class="ink" d="M55,120 Q34,138 41,167"/>
    <circle class="fillc" cx="41" cy="168" r="6"/>
    <rect class="fillc" x="70" y="150" width="15" height="30" rx="6"/>
    <rect class="fillc" x="96" y="154" width="15" height="27" rx="6"/>
    <rect class="fillc" x="124" y="151" width="15" height="30" rx="6"/>
    <rect class="fillc" x="149" y="153" width="15" height="28" rx="6"/>
    <ellipse class="fillc" cx="106" cy="128" rx="53" ry="30"/>
    <path class="ink" d="M158,80 Q150,65 143,60"/>
    <path class="ink" d="M187,78 Q198,66 205,62"/>
    <path class="fillc" d="M150,73 L162,66 L163,80 Z"/>
    <circle class="fillc" cx="173" cy="95" r="27"/>
    <circle class="ink" cx="182" cy="90" r="2.3" fill="currentColor"/>
    <ellipse class="paperc" cx="198" cy="105" rx="13" ry="9"/>
  </g>

  <g id="rest">
    <path class="ink" d="M121,106 Q141,121 138,146"/>
    <ellipse class="fillc" cx="137" cy="149" rx="10" ry="7"/>
    <path class="ink" d="M130,86 Q146,96 149,113"/>
    <circle class="ink" cx="150" cy="120" r="7"/>
    <circle class="ink" cx="150" cy="120" r="3.2"/>
    <rect class="fillc" x="118" y="78" width="23" height="33" rx="11"/>
    <circle class="paperc" cx="131" cy="64" r="13"/>
    <ellipse class="fillc" cx="131" cy="55" rx="21" ry="6"/>
    <rect class="fillc" x="120" y="39" width="22" height="17" rx="7"/>
    <rect class="accent" x="119" y="50" width="24" height="5" rx="2"/>
    <circle id="hand" cx="149" cy="113" r="1" fill="none" stroke="none"/>
  </g>

  <g id="throw" style="display:none">
    <path class="ink" d="M121,106 Q141,121 138,146"/>
    <ellipse class="fillc" cx="137" cy="149" rx="10" ry="7"/>
    <path class="ink" d="M130,85 Q152,72 181,55"/>
    <path class="ink" d="M181,55 Q193,46 200,40" fill="none"/>
    <circle class="ink" cx="212" cy="35" r="17" fill="none"/>
    <rect class="fillc" x="118" y="78" width="23" height="33" rx="11"/>
    <circle class="paperc" cx="131" cy="64" r="13"/>
    <ellipse class="fillc" cx="131" cy="55" rx="21" ry="6"/>
    <rect class="fillc" x="120" y="39" width="22" height="17" rx="7"/>
    <rect class="accent" x="119" y="50" width="24" height="5" rx="2"/>
    <circle id="hand" cx="181" cy="55" r="1" fill="none" stroke="none"/>
  </g>
</svg>
