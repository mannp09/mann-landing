<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16233C" />
    <script>
      // Sets html[data-theme] before first paint, so the page never
      // flashes. A reload lands at the top (Mann, 2026-09-04: "I would
      // imagine refresh would take us to the top"). The browser's own
      // scroll restoration is switched off before the first paint; a URL
      // with a hash still jumps to its anchor as usual.
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          if (!location.hash) window.scrollTo(0, 0);
        } catch (e) {}
      })();
      // His ruling 2026-09-14: "remove light theme - lets focus on
      // regular first." Always dark, a stored 'theme' value (from before
      // this ruling, or written later by anything that still calls
      // ThemeContext's setter) is never read here. The toggle is off the
      // header; light's CSS and ThemeContext/ThemeToggle stay in the
      // tree, unused, so light can come back later.
      document.documentElement.setAttribute('data-theme', 'dark');
      // Language default, before first paint - mirrors the theme script
      // above so a visitor in India never sees English for a frame (the
      // plan's gap-fix table). Order: a stored choice always wins; else
      // the browser's own signals (timezone Asia/Kolkata or Asia/Calcutta,
      // or a navigator.languages tag starting gu/hi/en-IN) pick gu; else
      // en. The IP lookup below can only ADD gu at runtime, never remove
      // it and never override a stored choice - LanguageContext mirrors
      // this attribute once React mounts, the same way ThemeContext does.
      (function () {
        try {
          var stored = localStorage.getItem('rodeo.lang');
          var lang = stored === 'en' || stored === 'gu' ? stored : null;
          if (!lang) {
            var tz = '';
            try {
              tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
            } catch (e2) {}
            var langs = navigator.languages || [navigator.language || ''];
            var indiaSignal =
              tz === 'Asia/Kolkata' ||
              tz === 'Asia/Calcutta' ||
              langs.some(function (l) {
                return /^(gu|hi|en-IN)/i.test(l);
              });
            lang = indiaSignal ? 'gu' : 'en';
          }
          document.documentElement.setAttribute('lang', lang);
          // The actual preload <link> is injected by
          // src/i18n/preloadGujaratiFont.ts instead of here: this raw
          // script runs before Vite's asset pipeline exists, so a literal
          // path string here (/src/assets/fonts/...) would 404 once the
          // build hashes and moves that file - the module import Vite
          // resolves at build time is the only way to get the real URL
          // in both dev and prod. That module still runs before React's
          // first render, so the font request starts at the same point
          // in the load a static preload would have.
        } catch (e) {
          document.documentElement.setAttribute('lang', 'en');
        }
      })();
      // One IP lookup at runtime, after paint - PRICE gate (T0), said out
      // loud per the plan: ipapi.co free tier is 1,000 lookups/day, no
      // key, HTTPS, CORS; each visitor costs one lookup a day (cached 24h
      // in localStorage rodeo.geo). Above the daily cap it 429s and the
      // browser signal above simply stands - cheaper path (zero calls,
      // browser signal only) misses a US-configured phone roaming in
      // India, which is why this call exists. It can only ADD gu - a
      // visitor who tapped the chip (rodeo.lang.chosen) is never
      // overridden, and a non-IN result never removes a gu the browser
      // signal already picked.
      (function () {
        try {
          if (localStorage.getItem('rodeo.lang.chosen') === '1') return;
          var cached = null;
          try {
            cached = JSON.parse(localStorage.getItem('rodeo.geo') || 'null');
          } catch (e3) {}
          var fresh = cached && Date.now() - cached.at < 24 * 60 * 60 * 1000;
          var apply = function (countryCode) {
            if (localStorage.getItem('rodeo.lang.chosen') === '1') return;
            if (localStorage.getItem('rodeo.lang')) return; // stored choice from a prior visit wins
            if (countryCode === 'IN') {
              document.documentElement.setAttribute('lang', 'gu');
              window.dispatchEvent(new CustomEvent('rodeo:geo-lang', { detail: 'gu' }));
            }
            // any other country: leave whatever the browser-signal script above picked
          };
          if (fresh) {
            apply(cached.country_code);
            return;
          }
          var ctrl = new AbortController();
          var timer = setTimeout(function () {
            ctrl.abort();
          }, 1500);
          fetch('https://ipapi.co/json/', { signal: ctrl.signal })
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              clearTimeout(timer);
              try {
                localStorage.setItem(
                  'rodeo.geo',
                  JSON.stringify({ country_code: data.country_code, at: Date.now() })
                );
              } catch (e4) {}
              apply(data.country_code);
            })
            .catch(function () {
              clearTimeout(timer);
              // timeout or network failure - fails quietly, browser signal stands
            });
        } catch (e) {
          // fails quietly, browser signal stands
        }
      })();
      // Phase 4 (design handoff sec 04, opening-animation.html B2):
      // once-per-visit intro entrance. Runs before first paint, like the
      // theme/lang scripts above, so html.intro-play is already present
      // when Hero mounts - the class landing after mount would flash the
      // page from its resting (visible) state into the animation's hidden
      // "from" state. sessionStorage (not localStorage) is the per-visit
      // scope her spec asks for: a fresh tab/context always replays, a
      // reload within the same tab does not. Two conditions from her
      // spec: never on a hash landing (the visitor arrived partway down
      // the page, not at the top), and never a second time in the same
      // session (covers clicking back-to-top too, since that is a scroll,
      // not a reload - this class is only ever set once per session
      // regardless).
      (function () {
        try {
          if (!location.hash && !sessionStorage.getItem('rodeo.introPlayed')) {
            document.documentElement.classList.add('intro-play');
            sessionStorage.setItem('rodeo.introPlayed', '1');
          }
        } catch (e) {
          // fails quietly - hero just renders in its resting state
        }
      })();
    </script>
